// ส่งแบบ chunk ผ่าน iframe form POST
function formPost(url, params) {
  return new Promise((resolve) => {
    const iframe = document.createElement('iframe');
    iframe.name = '_f' + Date.now();
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframe.name;
    form.style.display = 'none';

    Object.entries(params).forEach(([k,v]) => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = k; inp.value = v;
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    form.submit();

    // รอ 4 วินาที แล้ว resolve (no-cors ไม่รู้ผล)
    setTimeout(() => {
      if(form.parentNode) form.parentNode.removeChild(form);
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
      resolve(true);
    }, 4000);
  });
}

let cbCount = 0;
function gasJsonp(url, onSuccess, onError) {
  const cb = '_cb' + (++cbCount) + '_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cb];
    if(s.parentNode) s.parentNode.removeChild(s);
    if(onError) onError();
  }, 15000);
  window[cb] = function(data) {
    clearTimeout(timeout);
    delete window[cb];
    if(s.parentNode) s.parentNode.removeChild(s);
    if(onSuccess) onSuccess(data);
  };
  const s = document.createElement('script');
  s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb + '&t=' + Date.now();
  s.onerror = () => { clearTimeout(timeout); delete window[cb]; if(onError) onError(); };
  document.head.appendChild(s);
}

async function doRestoreChunked() {
  const btn = document.getElementById('btn');
  const progress = document.getElementById('progress');
  const progressText = document.getElementById('progress-text');
  const successEl = document.getElementById('success');
  const errEl = document.getElementById('error');

  btn.disabled = true;
  progress.style.display = 'block';
  successEl.style.display = 'none';
  errEl.style.display = 'none';

  try {
    progressText.textContent = 'กำลังส่งข้อมูล 171 โครงการ...';

    // ส่ง projects ทั้งหมดผ่าน form POST
    await formPost(GAS_URL, {
      action: 'saveProjects',
      projects: JSON.stringify(ALL_PROJECTS)
    });

    progressText.textContent = 'กำลังตรวจสอบผล...';

    // รอ 2 วิแล้วเช็คว่าข้อมูลขึ้น GAS แล้วหรือยัง
    await new Promise(r => setTimeout(r, 2000));

    gasJsonp(GAS_URL + '?action=getProjects', function(d) {
      progress.style.display = 'none';
      if(d && d.projects && d.projects.length > 0) {
        successEl.style.display = 'block';
        successEl.innerHTML = '✅ Restore สำเร็จ!<br>' +
          '<strong>' + d.projects.length + ' โครงการ</strong> กลับมาแล้ว<br><br>' +
          '<a href="https://scable-survey.github.io/survey-h1-2026/#/h1-2026-admin" ' +
          'style="color:#166534;font-weight:700;font-size:16px;">→ ไปที่ Admin Panel</a>';
      } else {
        // ลองอีกครั้งด้วย GET (URL อาจยาวเกิน แต่ลองดู)
        progressText.textContent = 'ลองวิธีสำรอง...';
        progress.style.display = 'block';
        const encoded = encodeURIComponent(JSON.stringify(ALL_PROJECTS));
        gasJsonp(GAS_URL + '?action=saveProjects&projects=' + encoded, function(d2) {
          progress.style.display = 'none';
          if(d2 && d2.status === 'ok') {
            successEl.style.display = 'block';
            successEl.innerHTML = '✅ Restore สำเร็จ! ' + (d2.count||171) + ' โครงการ<br><br>' +
              '<a href="https://scable-survey.github.io/survey-h1-2026/#/h1-2026-admin" style="color:#166534;font-weight:700;">→ Admin Panel</a>';
          } else {
            errEl.style.display = 'block';
            errEl.textContent = 'ส่งข้อมูลสำเร็จแต่ตรวจสอบไม่ได้ ลองเปิด Admin Panel ดูครับ';
            errEl.innerHTML += '<br><br><a href="https://scable-survey.github.io/survey-h1-2026/#/h1-2026-admin">→ Admin Panel</a>';
          }
          btn.disabled = false;
        }, function() {
          progress.style.display = 'none';
          errEl.style.display = 'block';
          errEl.innerHTML = 'ลองเปิด Admin Panel ดูก่อนนะครับ อาจ restore แล้ว<br><br>' +
            '<a href="https://scable-survey.github.io/survey-h1-2026/#/h1-2026-admin">→ Admin Panel</a>';
          btn.disabled = false;
        });
      }
    }, function() {
      progress.style.display = 'none';
      errEl.style.display = 'block';
      errEl.innerHTML = 'GAS ไม่ตอบ ลองเปิด Admin Panel ดูก่อนครับ<br><br>' +
        '<a href="https://scable-survey.github.io/survey-h1-2026/#/h1-2026-admin">→ Admin Panel</a>';
      btn.disabled = false;
    });

  } catch(e) {
    progress.style.display = 'none';
    errEl.style.display = 'block';
    errEl.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}
